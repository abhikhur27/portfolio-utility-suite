[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afterfact-replay"
version = "0.1.0"
description = "Replay operational decisions across effective and knowledge time"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
afterfact = "afterfact.__main__:main"

[tool.setuptools.packages.find]
include = ["afterfact*"]
