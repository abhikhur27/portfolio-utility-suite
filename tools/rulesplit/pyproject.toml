[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "rulesplit"
version = "0.1.0"
description = "Counterexample-checked first-match ACL partitioning for bounded offload tables"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.scripts]
rulesplit = "rulesplit.__main__:main"
[tool.setuptools.packages.find]
include = ["rulesplit*"]
