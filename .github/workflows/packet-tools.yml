name: Check waveform and packet policy tools
on:
  push:
    paths: ['tools/stallwitness/**', 'tools/rulesplit/**', '.github/workflows/packet-tools.yml']
  pull_request:
    paths: ['tools/stallwitness/**', 'tools/rulesplit/**', '.github/workflows/packet-tools.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y iverilog gcc
      - run: python -m unittest discover -s tests -v
        working-directory: tools/stallwitness
      - run: python scripts/evaluate.py --seeds 8
        working-directory: tools/stallwitness
      - run: python -m unittest discover -s tests -v
        working-directory: tools/rulesplit
      - run: python demo.py build/demo
        working-directory: tools/rulesplit
      - run: python -m rulesplit examples/policy.json build/demo/traffic.pcap --rows 8 --native-check
        working-directory: tools/rulesplit
